name: Bug
description: Something in the extension itself is broken (popup, shortcut, settings, errors).
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: setup
    attributes:
      label: Browser, OS, screen reader
