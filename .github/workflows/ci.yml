name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, tests, specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint (ESLint incl. reversibility rule, web-ext)
        run: npm run lint
      - name: Smoke test (fixture, names from Chromium's accessibility tree)
        run: npm test
      - name: End-to-end (real unpacked extension)
        run: npm run test:e2e
      - name: OpenSpec specs and changes are valid
        run: npx openspec validate --all --strict
